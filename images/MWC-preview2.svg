<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="c3_bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Authentic Blender Weight Paint Spectrum: Left (Blue 0.0) -> Cyan -> Green (0.5) -> Yellow -> Right (Red 1.0) -->
    <linearGradient id="weightPaintSpectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>   <!-- 0.0: Blue -->
      <stop offset="22%" stop-color="#06b6d4"/>  <!-- 0.25: Cyan -->
      <stop offset="50%" stop-color="#22c55e"/>  <!-- 0.5: Green -->
      <stop offset="78%" stop-color="#eab308"/>  <!-- 0.75: Yellow -->
      <stop offset="100%" stop-color="#dc2626"/> <!-- 1.0: Pure Red -->
    </linearGradient>

    <!-- Glowing Metaball Center Nodes (Local Shading) -->
    <radialGradient id="mb_blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <radialGradient id="mb_cyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>

    <radialGradient id="mb_green" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>

    <radialGradient id="mb_yellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <radialGradient id="mb_red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="c3_intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="c3_softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text & Rim Gradients (Weight Paint Spectrum without white start) -->
    <linearGradient id="c3_txtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>   <!-- 0.0: Blue at 'M' -->
      <stop offset="25%" stop-color="#06b6d4"/>  <!-- 0.25: Cyan -->
      <stop offset="50%" stop-color="#22c55e"/>  <!-- 0.5: Green at 'W' -->
      <stop offset="75%" stop-color="#eab308"/>  <!-- 0.75: Yellow -->
      <stop offset="100%" stop-color="#ef4444"/> <!-- 1.0: Red at 'C' -->
    </linearGradient>

    <linearGradient id="c3_borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Container -->
  <rect width="800" height="800" rx="140" fill="url(#c3_bg)"/>
  <rect width="794" height="794" x="3" y="3" rx="137" fill="none" stroke="url(#c3_borderGrad)" stroke-width="2"/>

  <!-- Ambient Light Orbs (Cold Blue on Left, Warm Red on Right) -->
  <circle cx="250" cy="350" r="180" fill="#2563eb" opacity="0.1" filter="url(#c3_intenseGlow)"/>
  <circle cx="400" cy="380" r="150" fill="#16a34a" opacity="0.08" filter="url(#c3_intenseGlow)"/>
  <circle cx="550" cy="350" r="180" fill="#dc2626" opacity="0.12" filter="url(#c3_intenseGlow)"/>

  <!-- Geometric Reference Grid & Concentric Potential Waves (Solid Subtle Lines) -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="400" cy="340" r="260"/>
    <circle cx="400" cy="340" r="180"/>
    <circle cx="400" cy="340" r="100"/>
    <line x1="140" y1="340" x2="660" y2="340"/>
    <line x1="400" y1="80" x2="400" y2="600"/>
  </g>

  <!-- THE DYNAMIC "M" METABALL MARK WITH HORIZONTAL WEIGHT PAINT SPECTRUM (Blue -> Red) -->
  <g filter="url(#c3_intenseGlow)">
    <!-- Continuous organic "M" path: left pillar is Blue, center is Green, right pillar is Red -->
    <path d="M 220 480 
             L 220 270 
             C 220 200, 310 180, 350 250 
             L 400 330 
             L 450 250 
             C 490 180, 580 200, 580 270 
             L 580 480 
             C 580 520, 520 520, 520 480 
             L 520 310 
             L 440 430 
             C 420 460, 380 460, 360 430 
             L 280 310 
             L 280 480 
             C 280 520, 220 520, 220 480 Z"
          fill="url(#weightPaintSpectrum)"/>
  </g>

  <!-- Spherical Metaball Centers (0.0 Blue -> 0.25 Cyan -> 0.5 Green -> 0.75 Yellow -> 1.0 Pure Red) -->
  <g filter="url(#c3_softGlow)">
    <!-- Bottom-Left Base MB (Weight 0.0: Cold Blue) -->
    <circle cx="250" cy="480" r="42" fill="url(#mb_blue)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Top-Left Crest MB (Weight 0.25: Cyan) -->
    <circle cx="250" cy="240" r="48" fill="url(#mb_cyan)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Center Dip MB (Weight 0.5: Green) -->
    <circle cx="400" cy="380" r="44" fill="url(#mb_green)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Top-Right Crest MB (Weight 0.75: Yellow) -->
    <circle cx="550" cy="240" r="48" fill="url(#mb_yellow)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Bottom-Right Base MB (Weight 1.0: Pure Vibrant Red) -->
    <circle cx="550" cy="480" r="42" fill="url(#mb_red)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4"/>
  </g>

  <!-- Skeleton Rigging Bones & Kinematic Joints (SOLID LINES) -->
  <g stroke-linecap="round">
    <!-- Solid Rigging Bones connecting all 5 joints -->
    <line x1="250" y1="480" x2="250" y2="240" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>
    <line x1="250" y1="240" x2="400" y2="380" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>
    <line x1="400" y1="380" x2="550" y2="240" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>
    <line x1="550" y1="240" x2="550" y2="480" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>

    <!-- Glowing Bone Joint Nodes -->
    <circle cx="250" cy="480" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#c3_softGlow)"/>
    <circle cx="250" cy="240" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="2" filter="url(#c3_softGlow)"/>
    <circle cx="400" cy="380" r="12" fill="#22c55e" stroke="#ffffff" stroke-width="2.5" filter="url(#c3_softGlow)"/>
    <circle cx="550" cy="240" r="10" fill="#facc15" stroke="#ffffff" stroke-width="2" filter="url(#c3_softGlow)"/>
    <circle cx="550" cy="480" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#c3_softGlow)"/>
  </g>

  <!-- Weight Scale Bar (Visual Legend at the top: 0.0 -> 1.0) -->
  <g transform="translate(290, 140)">
    <rect x="0" y="0" width="220" height="6" rx="3" fill="url(#weightPaintSpectrum)" opacity="0.9"/>
    <text x="0" y="-6" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">0.0</text>
    <text x="110" y="-6" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#22c55e" text-anchor="middle">0.5</text>
    <text x="220" y="-6" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="end">1.0</text>
  </g>

  <!-- Weight Transfer Arrows / Energy Field Rays (Solid Lines) -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <line x1="325" y1="310" x2="310" y2="325"/>
    <line x1="475" y1="310" x2="490" y2="325"/>
    <circle cx="310" cy="325" r="2.5" fill="#ffffff"/>
    <circle cx="490" cy="325" r="2.5" fill="#ffffff"/>
  </g>

  <!-- TYPOGRAPHY & BRANDING -->
  <g text-anchor="middle">
    <!-- Logotype "MWC" -->
    <text x="400" y="650" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Outfit, Inter, sans-serif" 
          font-size="60" 
          font-weight="900" 
          letter-spacing="14" 
          fill="url(#c3_txtGrad)"
          filter="url(#c3_softGlow)">MWC</text>

    <!-- Subtitle -->
    <text x="400" y="694" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Outfit, Inter, sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#94a3b8">METABALL WEIGHT CONTAINER</text>

    <!-- Version Badge (v1.1) -->
    <g transform="translate(400, 726)">
      <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
      <text x="0" y="4.5" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
            font-size="10.5" 
            font-weight="700" 
            letter-spacing="2" 
            fill="#4ade80">BLENDER ADDON v1.1</text>
    </g>
  </g>
</svg>
